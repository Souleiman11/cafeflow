# Only the frontend is exposed. Its nginx forwards /api and the health probes to the backend, so
# the rest of /actuator and the ML service are never reachable from outside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cafeflow
  labels:
    app.kubernetes.io/part-of: cafeflow
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cafeflow.example.com
      secretName: cafeflow-tls
  rules:
    - host: cafeflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
