apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: &labels
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cafeflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: cafeflow/frontend:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: cafeflow-config
                  key: BACKEND_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          # The nginx entrypoint renders its config into /etc/nginx/conf.d at start-up, so the
          # root filesystem cannot be read-only here without extra volume plumbing.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
